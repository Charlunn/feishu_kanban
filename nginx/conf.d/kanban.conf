# HTTP → HTTPS redirect
server {
    listen 80;
    server_name kanban.yourcompany.com;

    # Let's Encrypt challenge (if using certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name kanban.yourcompany.com;

    # SSL certificates — replace with your actual paths
    ssl_certificate     /etc/letsencrypt/live/kanban.yourcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kanban.yourcompany.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "ALLOW-FROM https://open.feishu.cn" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow Feishu iframe embedding
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.feishu.cn https://*.larksuite.com" always;

    # Proxy to Next.js
    location / {
        proxy_pass http://kanban:3015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Static assets cache
    location /_next/static/ {
        proxy_pass http://kanban:3015;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
